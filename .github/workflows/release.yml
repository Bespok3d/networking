name: build-and-release

# On a push to main that changes the plugin, its toolchain, or the build scripts: cross-build
# tun.ko, pack the .b3, publish a GitHub release, and write the index atom into Bespok3d/main-index
# so the published catalog picks the plugin up. Modeled on plugins/u1-hw-camera's release.yml; the
# .ko build is a native linux/amd64 Docker build (the ARM cross-toolchain targets aarch64 from the
# x86 runner), so there is no QEMU step, unlike the camera's arm64-under-QEMU build.
on:
  push:
    branches: [main]
    paths:
      - plugin/**
      - toolchain/**
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release on this repo
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN so buildx can read/write the GitHub
      # Actions layer cache (the type=gha referenced by B3D_CACHE_ARGS below).
      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cross-build tun.ko
        # First run fills the cache (apt + the ARM toolchain download + the kernel fetch); every run
        # after restores those layers and only re-links the module.
        env:
          B3D_CACHE_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
        run: sh toolchain/build.sh

      - name: Pack the .b3
        run: sh scripts/pack.sh

      - name: Resolve version
        id: ver
        run: echo "version=$(jq -r '.version' plugin/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release + upload .b3
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="tun-module-v${VERSION}"
          ASSET="tun-module-${VERSION}.b3"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Automated release of ${ASSET}"
          fi
          gh release upload "$TAG" "dist/${ASSET}" --clobber

      - name: Generate atom with the release asset URL
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="tun-module-v${VERSION}"
          ASSET="tun-module-${VERSION}.b3"
          # The asset's API URL (.url, not browser_download_url) is what the app fetches with a
          # bearer token + Accept: application/octet-stream (works for private repos).
          DOWNLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq ".assets[] | select(.name==\"${ASSET}\") | .url")
          echo "download_url=${DOWNLOAD_URL}"
          node scripts/generate-atom.mjs --download-url "$DOWNLOAD_URL" --repo "$GITHUB_REPOSITORY"

      - name: Commit atom into Bespok3d/main-index
        env:
          # Fine-grained PAT with contents:write on Bespok3d/main-index (the per-repo GITHUB_TOKEN
          # cannot write a sibling repo). Create it in the org and add it as this repo's secret.
          MAIN_INDEX_TOKEN: ${{ secrets.MAIN_INDEX_TOKEN }}
        run: |
          git clone "https://x-access-token:${MAIN_INDEX_TOKEN}@github.com/Bespok3d/main-index.git" main-index
          mkdir -p main-index/atoms
          cp dist/tun-module.atom.json main-index/atoms/tun-module.atom.json
          cd main-index
          git config user.name "bespok3d-bot"
          git config user.email "bot@bespok3d.local"
          git add atoms/tun-module.atom.json
          if git diff --cached --quiet; then
            echo "atom unchanged; nothing to commit"
          else
            git commit -m "tun-module ${{ steps.ver.outputs.version }}: update atom"
            git push
          fi
