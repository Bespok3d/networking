# Re-declares [authorization] so Moonraker (last-include-wins per option, see confighelper.py)
# trusts requests arriving over the tailnet. Tailscale's 100.64.0.0/10 (RFC 6598 CGNAT) is not in
# Moonraker's stock trusted list, so without this a request over the tailnet is asked to log in even
# though a LAN request is not. The list below is the U1 stock trusted_clients with 100.64.0.0/10
# added; cors_domains is the stock list unchanged. Removing this plugin removes this file, restoring
# the stock behavior.
[authorization]
trusted_clients:
    172.18.0.0/16
    10.0.0.0/8
    100.64.0.0/10
    127.0.0.0/8
    169.254.0.0/16
    172.16.0.0/12
    192.0.0.0/8
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz
